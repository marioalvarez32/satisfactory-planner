name: Build and Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write

jobs:  
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Set your Node.js version

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build  # Replace with your build command

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/  # Replace with your build directory
          
  deploy:
    needs: build
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:       
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with: 
          name: build-artifacts

      - name: Install LFTP
        run: sudo apt-get install lftp
        
      - name: Clear Remote Directory
        run: |
          lftp -e "
          set ssl:verify-certificate no;
          open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
          echo 'Changing to target directory...';
          cd public_html/assets;  # Remote directory to be cleared
          echo 'Removing files...';
          mrm *;  # Remove all files in the directory
          echo 'Exiting...';
          bye;
          "
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          
      - name: Upload files using LFTP
        run: |
          lftp -e "
          set ssl:verify-certificate no;
          open ftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
          lcd ${{ github.workspace }};  # Local directory where files are downloaded
          cd public_html/;  # Remote directory where files should be uploaded
          mirror --reverse --verbose;
          bye;
          "
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
